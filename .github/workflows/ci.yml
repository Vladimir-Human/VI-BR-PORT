name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Cheapest steps first; docs/ci.md says how to run each one locally.
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The fork's own rules, read from the sources in seconds: the asset
      # policy, the shader cache's switches, English sources, documentation
      # links, crate manifests (xtask/src/*.rs).
      - name: Repository rules
        run: cargo test -p xtask --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Broken intra-doc links. The diagnostics build, which documents every
      # module; links from public items into private ones are let through.
      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings -A rustdoc::private_intra_doc_links"
        run: cargo doc --workspace --no-deps --all-features --locked
      - name: Tests
        run: cargo test --workspace --locked
